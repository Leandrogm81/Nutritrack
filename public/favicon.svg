<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="50%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Letter N -->
  <text x="256" y="330" font-family="Arial Black, sans-serif" font-size="280" font-weight="900"
        fill="white" text-anchor="middle" dominant-baseline="auto">N</text>
  <!-- Leaf -->
  <ellipse cx="360" cy="140" rx="55" ry="85" fill="#86efac" transform="rotate(-35 360 140)"/>
  <ellipse cx="360" cy="140" rx="30" ry="70" fill="#4ade80" transform="rotate(-35 360 140)"/>
  <!-- Orange dot -->
  <circle cx="195" cy="115" r="28" fill="#f97316"/>
</svg>
